# Docker-in-Docker (DinD) — macOS / ARM64
#
# A private dockerd runs in the `dind` sidecar and the runner talks to it over
# TLS. The host's /var/run/docker.sock is NOT mounted, so jobs cannot reach the
# host daemon (no container escape, no clobbering host images) — and jobs never
# queue on the host daemon's build graph, GC lock, iptables lock, or port
# space. The host daemon keeps working normally for everything else.
#
# One stack = one runner = one job at a time = one private daemon. Deploy N
# stacks to run N jobs concurrently — each `-p` name gets its own volumes:
#
#   docker compose -p runner-1 -f docker/mac/docker-compose.dind.yml up -d
#   docker compose -p runner-2 -f docker/mac/docker-compose.dind.yml up -d
#
# Because each job's published ports bind inside its own stack's network
# namespace, parallel jobs that both ask for e.g. 5432:5432 do not collide.
#
# `privileged: true` is honoured inside the Docker Desktop VM on macOS.
name: gh-runner-dind-arm64

services:
  dind:
    image: docker:28-dind
    platform: linux/arm64
    # Required — dockerd needs to manage cgroups, netns and iptables.
    privileged: true
    restart: always
    networks:
      default:
        # dind's self-signed server cert is issued for the name "docker", so the
        # runner must dial tcp://docker:2376 or TLS verification fails with
        # "certificate is valid for docker, ..., not dind".
        aliases:
          - docker
    environment:
      # Makes dind generate a CA plus server/client certs and listen on 2376.
      DOCKER_TLS_CERTDIR: /certs
      # Uncomment if the host's filesystem can't back overlay2 (e.g. ZFS):
      # DOCKER_DRIVER: vfs
    volumes:
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
      - dind-storage:/var/lib/docker
      # Mounted at the SAME path as in the runner. Without this, a job doing
      # `docker run -v $PWD:/src` would bind a path that only exists in the
      # runner container and silently get an empty directory.
      - runner-work:/home/runner/_work
      # Bounds this stack's build cache (BuildKit GC) and widens its private
      # address pool / pull queue — see the file for the knobs.
      - ./dind-daemon.json:/etc/docker/daemon.json:ro
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Builds, job containers, and service containers all execute HERE, not in
    # the runner — this is the cap on what one job can take from the host.
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 1G

  runner:
    image: ghcr.io/stoxly-ai/self-hosted-runner:latest-arm64
    # Uncomment to build locally instead of pulling from GHCR
    # build: .
    platform: linux/arm64
    restart: always
    depends_on:
      dind:
        condition: service_healthy
    # The runner lives in dind's network namespace, so ports published by job
    # service containers (`services:` in a workflow, `docker run -p ...`)
    # appear on the runner's OWN localhost — which is where
    # `localhost:${{ job.services.<name>.ports[...] }}` expects them. Without
    # this, those ports bind only inside dind and every services-based job
    # breaks. (Hostname/UTS stays per-container, so runner self-naming still
    # works.)
    network_mode: service:dind
    env_file:
      - ../../.env
    # These take precedence over .env — do not set them there.
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      WORK_DIR: /home/runner/_work
    volumes:
      - docker-certs-client:/certs/client:ro
      - runner-work:/home/runner/_work
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Keep this at one replica. WORK_DIR is a volume shared with dind at a
    # fixed path, so a second replica would run jobs out of the same _work
    # tree and clash on job directories. To add capacity, start another stack
    # (`docker compose -p runner-2 ... up -d`) — see the header comment.
    # These limits cover job STEP processes; docker workloads are capped on
    # the dind service above.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  docker-certs-ca:
  docker-certs-client:
  dind-storage:
  runner-work:
