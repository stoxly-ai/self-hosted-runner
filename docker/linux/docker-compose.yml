# Socket mount (Docker-out-of-Docker) — Linux / x64
#
# Jobs drive the HOST's Docker daemon through the bind-mounted socket. Fast and
# shares the host image cache, but a job can start a privileged container on the
# host, so it is effectively root on the host. For isolation use the sidecar
# daemon in docker-compose.dind.yml instead.
services:
  runner:
    image: ghcr.io/stoxly-ai/self-hosted-runner:latest
    # Uncomment to build locally instead of pulling from GHCR
    # build: .
    restart: always
    env_file:
      - ../../.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "run.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      mode: replicated
      # Leave NAME unset in .env when running more than one replica — each
      # runner then self-registers under its container hostname, which Docker
      # makes unique. Setting NAME pins every replica to the same identity.
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.4'
          memory: 256M